[package]
name = "observatory-event-tests"
version = "0.1.0"
edition = "2021"

[lib]
name = "event_slice"

[[bin]]
name = "observatory-event"
path = "src/emitter.rs"

[dependencies]
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
regex = "=1.13.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Pipes", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
